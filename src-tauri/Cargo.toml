[package]
name = "cerne"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cerne_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# Keyring com backend POR ALVO: o código (config.rs, custom.rs, search.rs)
# usa a mesma API `keyring::Entry` em todos os SOs — só as features mudam.
# - windows-native: Credential Manager (correção do bug documentado no README
#   de chaves que não eram salvas de verdade — NÃO remover)
# - linux-native: Secret Service via D-Bus — exige libsecret + gnome-keyring
#   ou kwallet instalados no sistema (documentar como dependência de sistema)
# - apple-native: macOS Keychain
# Fallback pra Linux headless/sem keyring ainda é decisão aberta (Tarefa 1.1).
keyring = { version = "3", features = ["windows-native", "linux-native", "apple-native"] }
similar = "2"
ignore = "0.4"
grep = "0.3"
dashmap = "6"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
configparser = "3"
toml = "0.8"
regex = "1"
scraper = "0.20"
url = "2"
ast-grep-core = "0.44"
ast-grep-language = "0.44"
encoding_rs = "0.8"
chardetng = "1"
rmcp = { version = "2", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
calamine = "0.36.0"
pdf-extract = "0.12.0"
docx-rust = "0.1.11"
base64 = "0.22.1"
enigo = "0.6"
xcap = "0.9"
image = "0.25"
tokio-tungstenite = { version = "0.24", features = ["connect"] }
rust_xlsxwriter = "0.84"
printpdf = "0.3"
zip = "8.6.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
] }
uiautomation = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
# Backend de input do computer_use em sessoes Wayland (Tarefa 3.1b): o enigo
# nao injeta input no Wayland por design do protocolo, entao usamos o portal
# xdg-desktop RemoteDesktop (consentimento explicito via dialogo nativo do
# compositor) combinado com Screencast so pra obter o node id do PipeWire
# que notify_pointer_motion_absolute exige como referencia de coordenadas.
ashpd = { version = "0.13", features = ["remote_desktop", "screencast"] }
# AX-tree sem visao no Linux (Tarefa 3.3): AT-SPI2 e o equivalente ao UI
# Automation do Windows pra apps GTK/Qt. zbus e dependencia direta (nao so
# transitiva via atspi) porque resolvemos o PID de cada app via
# org.freedesktop.DBus.GetConnectionUnixProcessID manualmente.
atspi = "0.30"
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# TCC (Accessibility/Screen Recording) pro computer_use no macOS (Tarefa
# 3.1c) - plugin dedicado em vez de reimplementar as chamadas objc2
# (CGRequestScreenCaptureAccess/AXIsProcessTrustedWithOptions) na mao, sem
# nenhuma forma de compilar/testar isso aqui (sem toolchain C pra macOS no
# Windows - nem `cargo check --target aarch64-apple-darwin` funciona).
tauri-plugin-macos-permissions = "2"

[dev-dependencies]

